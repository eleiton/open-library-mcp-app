<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Search</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #5f6368;
            --card-bg: #f6f7f9;
            --card-border: #e1e3e8;
            --chip-bg: #eaecef;
            --chip-bg-hover: #d8dde3;
            --chip-fg: #1a1a1a;
            --accent: #1a73e8;
            --error-bg: #fdecea;
            --error-fg: #b3261e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1e22;
                --fg: #f1f1f1;
                --muted: #a8acb3;
                --card-bg: #25272d;
                --card-border: #3a3d44;
                --chip-bg: #353841;
                --chip-bg-hover: #454953;
                --chip-fg: #f1f1f1;
                --accent: #8ab4f8;
                --error-bg: #3a1f1f;
                --error-fg: #f5b5af;
            }
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--fg);
        }
        .header {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .header:empty { display: none; }
        .error {
            background: var(--error-bg);
            color: var(--error-fg);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
        }
        .empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--muted);
            font-size: 14px;
        }
        .grid {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 6px;
        }
        .card {
            flex: 0 0 150px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--card-border); }
        .cover-fallback {
            width: 100%; aspect-ratio: 2/3;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: 600;
            color: var(--muted); background: var(--card-border);
        }
        .body { padding: 8px 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; margin: 0 0 8px; line-height: 1.3; }
        .title a {
            color: inherit; text-decoration: none;
            background-image: linear-gradient(currentColor, currentColor);
            background-size: 0 1px; background-repeat: no-repeat;
            background-position: 0 100%;
            transition: background-size 0.15s;
        }
        .title a:hover, .title a:focus { background-size: 100% 1px; cursor: pointer; outline: none; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip {
            font: inherit; font-size: 12px;
            background: var(--chip-bg); color: var(--chip-fg);
            border: none; padding: 4px 10px; border-radius: 999px;
            cursor: pointer; line-height: 1.4;
        }
        .chip:hover { background: var(--chip-bg-hover); }
        .chip.author { border-left: 3px solid var(--accent); padding-left: 8px; }
        .explore {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .explore-label {
            font-size: 12px;
            color: var(--muted);
        }
        .skeleton {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
        }
        .skeleton-card {
            flex: 0 0 150px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            aspect-ratio: 2/3;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.9; } }
    </style>
</head>
<body>
<div class="header" id="header"></div>
<div id="content">
    <div class="skeleton">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>
</div>

<script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.2/app-with-deps";

    const headerEl = document.getElementById("header");
    const contentEl = document.getElementById("content");

    const showError = (msg) => {
        headerEl.textContent = "";
        contentEl.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    };

    const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[c]));

    const describeCriteria = (c) => {
        if (!c) return "all books";
        const parts = [];
        if (c.query) parts.push(`query "${c.query}"`);
        if (c.title) parts.push(`title "${c.title}"`);
        if (c.author) parts.push(`author "${c.author}"`);
        if (c.authorKey || c.author_key) parts.push(`author ${c.authorKey || c.author_key}`);
        if (c.subject) parts.push(`subject "${c.subject}"`);
        if (c.isbn) parts.push(`ISBN ${c.isbn}`);
        if (c.language) parts.push(`language ${c.language}`);
        return parts.join(", ") || "all books";
    };

    const sendChat = (text) => {
        if (typeof app?.sendMessage !== "function") return;
        app.sendMessage({
            role: "user",
            content: [{ type: "text", text }],
        }).catch((e) => console.error("sendMessage failed:", e));
    };

    const onChipClick = (btn) => {
        const kind = btn.dataset.kind;
        if (kind === "author") {
            sendChat(`Search books with author_key=${btn.dataset.key}`);
        } else if (kind === "subject") {
            sendChat(`Search books with subject=${JSON.stringify(btn.dataset.value)}`);
        }
    };

    const topSubjects = (books, n = 3) => {
        const counts = new Map();
        for (const b of books) {
            for (const s of (b.subjects || [])) {
                counts.set(s, (counts.get(s) || 0) + 1);
            }
        }
        return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(([s]) => s);
    };

    const renderResults = (data) => {
        const { criteria, totalFound, books } = data;
        const count = books?.length ?? 0;
        headerEl.textContent = count
            ? `Showing ${count} of ${(totalFound ?? 0).toLocaleString()} results for ${describeCriteria(criteria)}`
            : "";
        if (!count) {
            contentEl.innerHTML = `<div class="empty">No books found for ${escapeHtml(describeCriteria(criteria))}.</div>`;
            return;
        }
        const subjects = topSubjects(books);
        const exploreHtml = subjects.length ? `
            <div class="explore">
                <span class="explore-label">Explore by subject:</span>
                ${subjects.map((s) => `<button class="chip subject" data-kind="subject" data-value="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("")}
            </div>` : "";
        contentEl.innerHTML = `<div class="grid">${books.map(cardHtml).join("")}</div>${exploreHtml}`;
        contentEl.querySelectorAll(".chip").forEach((btn) => {
            btn.addEventListener("click", () => onChipClick(btn));
        });
        contentEl.querySelectorAll('a[data-kind="open-work"]').forEach((a) => {
            a.addEventListener("click", (e) => {
                e.preventDefault();
                openExternal(a.dataset.url);
            });
        });
    };

    const openExternal = (url) => {
        if (typeof app?.openLink === "function") {
            app.openLink({ url }).catch((e) => {
                console.warn("openLink failed, falling back to window.open:", e);
                window.open(url, "_blank", "noopener,noreferrer");
            });
        } else {
            window.open(url, "_blank", "noopener,noreferrer");
        }
    };

    const workUrl = (workKey) => workKey ? "https://openlibrary.org" + workKey : null;

    const cardHtml = (b) => {
        const cover = b.coverUrl
            ? `<img class="cover" src="${escapeHtml(b.coverUrl)}" alt="${escapeHtml(b.title)} cover" onerror="this.outerHTML='<div class=cover-fallback>${escapeHtml((b.title || '?').charAt(0))}</div>'">`
            : `<div class="cover-fallback">${escapeHtml((b.title || "?").charAt(0))}</div>`;
        const url = workUrl(b.workKey);
        const titleHtml = url
            ? `<a href="${escapeHtml(url)}" data-kind="open-work" data-url="${escapeHtml(url)}">${escapeHtml(b.title || "Untitled")}</a>`
            : escapeHtml(b.title || "Untitled");
        const authorChips = (b.authors || [])
            .filter((a) => a.key)
            .map((a) => `<button class="chip author" data-kind="author" data-key="${escapeHtml(a.key)}" data-name="${escapeHtml(a.name)}">${escapeHtml(a.name)}</button>`)
            .join("");
        return `
            <div class="card">
                ${cover}
                <div class="body">
                    <p class="title">${titleHtml}</p>
                    ${authorChips ? `<div class="chips">${authorChips}</div>` : ""}
                </div>
            </div>
        `;
    };

    const extractData = (result) => {
        if (!result) return null;
        if (result.structuredContent && typeof result.structuredContent === "object") {
            return result.structuredContent;
        }
        for (const c of (result.content || [])) {
            if (c?.type === "text" && typeof c.text === "string") {
                try { return JSON.parse(c.text); } catch { /* try next item */ }
            }
        }
        return null;
    };

    const pushSummary = (data) => {
        if (typeof app.updateModelContext !== "function") return;
        const c = data.criteria || {};
        const filters = [
            c.query    && `query=${JSON.stringify(c.query)}`,
            c.title    && `title=${JSON.stringify(c.title)}`,
            c.author   && `author=${JSON.stringify(c.author)}`,
            c.authorKey && `author_key=${c.authorKey}`,
            c.subject  && `subject=${JSON.stringify(c.subject)}`,
            c.isbn     && `isbn=${c.isbn}`,
            c.language && `language=${c.language}`,
        ].filter(Boolean);
        const titles = (data.books || []).map((b) => `"${b.title}"`).join(", ");
        const lines = [
            `Book search panel is showing ${data.books?.length ?? 0} of ${data.totalFound ?? 0} results.`,
            `Active filters: ${filters.length ? filters.join(", ") : "(none)"}.`,
            titles && `Titles shown: ${titles}.`,
            `If the user refines this search (e.g. "now by Tolkien", "only in Spanish"), call search-books again with these active filters PLUS any additions. Drop them only if the user clearly switches topic.`,
        ].filter(Boolean);
        app.updateModelContext({
            content: [{ type: "text", text: lines.join("\n") }],
        }).catch(() => {});
    };

    const app = new App({ name: "search-books", version: "1.0.0" }, {});

    app.ontoolresult = (result) => {
        if (result?.isError) {
            const text = (result.content || []).map((c) => c.text || "").join(" ") || "Tool error.";
            showError(text);
            return;
        }
        const data = extractData(result);
        if (data && Array.isArray(data.books)) {
            renderResults(data);
            pushSummary(data);
        }
    };

    app.connect().catch((err) => {
        showError(`Could not connect to MCP host: ${err?.message || String(err)}`);
    });
</script>
</body>
</html>
